[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cutlery-classifier"
version = "3.0.0"
authors = [
    { name="Ola Blom", email="ola.blom@example.com" },
]
description = "Offline inference MVP for cutlery classification (fork/knife/spoon)."
readme = "README.md"
requires-python = ">=3.8"
keywords = ["machine learning", "computer vision", "cutlery", "classification", "edge-ai", "pytorch"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research", 
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "pillow>=8.3.0",
    "numpy>=1.21.0",
    "onnx>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]
eval = [
    "scikit-learn>=1.6.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.13.0",
    "tqdm>=4.60.0",
    "pandas>=2.0.0",
]
gradcam = [
    "grad-cam>=1.4.0",
]
export = [
    "onnxruntime>=1.12.0",
]
# rtx5090 = [
#   "torch>=2.8.0.dev20250610+cu128"
# ]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[project.scripts]
cutlery-inference = "cutlery_classifier.scripts.run_inference:main"
cutlery-test = "cutlery_classifier.scripts.dev_test_shim:main"
cutlery-train = "cutlery_classifier.scripts.dev_train_shim:main"